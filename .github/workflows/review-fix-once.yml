name: Validate and commit shared-backend review fixes
on:
  push:
    branches: [feat/extract-shared-p256-backend]
    paths: [.github/workflows/review-fix-once.yml]
permissions:
  contents: write
jobs:
  fix:
    if: github.repository == 'SamuelSchlesinger/mole-p256-rs'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Reapply the pinned, previously tested source patch
        run: |
          python3 - <<'PY'
          import hashlib
          import subprocess
          revision = 'e84f7db7c09f99248a973b2891329e1ce079b01a'
          path = '.github/workflows/review-fix-once.yml'
          raw = subprocess.check_output(['git', 'show', revision + ':' + path])
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == '295e69c08c404c99b6cd5fbfe8469c727ce16015'
          workflow = raw.decode()
          start = '      - name: Apply only the reviewed source changes\n        run: |\n'
          end = '      - name: Validate RustCrypto in debug and release modes\n'
          assert workflow.count(start) == workflow.count(end) == 1
          block = workflow.split(start, 1)[1].split(end, 1)[0]
          lines = block.splitlines()
          assert all(not line.strip() or line.startswith('          ') for line in lines)
          script = '\n'.join(line[10:] if line.strip() else '' for line in lines) + '\n'
          subprocess.run(['bash', '-e', '-o', 'pipefail'], input=script, text=True, check=True)
          PY
          # Workflow changes are made separately through the repository connector.
          # This job commits source and tests only.
          git restore .github/workflows/ci.yml
      - name: Validate RustCrypto in debug and release modes
        run: |
          cargo fmt --check
          python3 scripts/generate-derivation-vectors.py --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo test --release
          cargo check --no-default-features --features rustcrypto
          cargo doc --no-deps
      - name: Commit the validated source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/backend src/hash.rs src/tests.rs src/tests
          git diff --cached --check
          git commit -m 'Restore backend APIs, handle oversized DSTs, and verify derivations independently' -m 'Assisted by ChatGPT.'
          git push origin HEAD:refs/heads/feat/extract-shared-p256-backend
          git show --stat --oneline HEAD
